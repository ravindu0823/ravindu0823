<svg xmlns="http://www.w3.org/2000/svg" width="846" height="300" viewBox="0 0 846 300" role="img" aria-labelledby="t d">
<title id="t">Ravindu Dhanushka Perera: Software Engineer, .NET and Azure</title>
<desc id="d">Animated banner: name and role on the left, an event-driven system diagram with packets moving from an API gateway through a service bus to identity, ledger and realtime services on the right.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111a33"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<linearGradient id="name" gradientUnits="userSpaceOnUse" x1="44" y1="0" x2="420" y2="0">
  <stop offset="0" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#22d3ee"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 90 0; 0 0" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="glowV"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.32"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<radialGradient id="glowA"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.26"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#2a3657"/></pattern>
<clipPath id="frame"><rect width="846" height="300" rx="18"/></clipPath>
<clipPath id="type"><rect x="40" y="52" width="282.5" height="28"><animate attributeName="width" from="0" to="282.5" dur="1.6s" begin="0s" fill="freeze"/></rect></clipPath></defs>
<style>
.flow { animation: dash 1.2s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -20; } }
.caret { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: 685px 152px; }
@keyframes pulse { 0%, 100% { opacity: 0.35; transform: scale(0.9); } 50% { opacity: 0.8; transform: scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .motion { display: none; } * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
