<circle cx="110" cy="-10" r="300" fill="url(#glowV)"/>
<circle cx="760" cy="320" r="300" fill="url(#glowA)"/>
<circle cx="685" cy="152" r="70" fill="url(#glowV)" class="pulse"/>
</g>
<rect x="0.5" y="0.5" width="845" height="299" rx="18" fill="none" stroke="#25314f"/>
<g clip-path="url(#type)">
